identifiers:
  commodity_code: {value: "0088", name: "Pasture,Rangeland,Forage", source: ["ADM27 A00420"], status: CONFIRMED}
  insurance_plan_code: {value: "13", name: "Rainfall Index (RI)", source: ["ADM27 A00460"], status: CONFIRMED}
  unit_of_measure: {value: "DOL", note: "insured in dollars of protection, not tons of forage", source: ["ADM27 A00030"], status: CONFIRMED}
  states_offered: {value: 49, note: "48 contiguous states plus Hawaii (Hawaii has its own crop provisions and uses HCDP data)", source: ["ADM27 A00030 distinct State Code"], status: CONFIRMED}

intended_uses:
  source: ["CP27 sec. 1 definitions and sec. 3(a)(2), p.1", "HB26 para 16, p.6", "ADM27 A00470, A00490, A00500, A00030", "DST API validation message"]
  status: CONFIRMED
  rule: "Each acre is insured as EITHER grazing OR haying in a crop year, never both."
  grazing:
    intended_use_code: "007"
    type_code: "007"
    definition: "Used solely as pasture for livestock to roam and feed on."
    irrigation_practice_codes: {"997": "No irrigation practice specified (grazing has no irrigated/non-irrigated split)"}
    organic_practice_codes: {"997": "No organic practice specified"}
    practice_code_rule: "practice_code = interval_code (625..635)"
    stocking_rate_rule:
      value: "Insured must have an insurable interest in livestock equal to at least 25% of the stocking rate for the insured acres (new for 2027)."
      min_fraction_of_stocking_rate: 0.25
      source: ["CP27 sec. 4(j), p.2", "PM26053", "HB27 Exhibit 4 item 8, p.49", "HB27 Exhibit 6, p.58"]
      status: CONFIRMED
  haying:
    intended_use_code: "030"
    type_code: "030"
    definition: "Severance of the plant from its root by mechanical equipment and cured."
    irrigation_practice_codes: {"002": "Irrigated", "003": "Non-Irrigated"}
    organic_practice_codes: {"997": "No organic practice (conventional)", "001": "Organic (certified)", "002": "Organic (transitional)"}
    practice_code_rule:
      irrigated_conventional: "interval_code - 200 (425..435)"
      irrigated_certified_organic: "interval_code - 160 (465..475)"
      irrigated_transitional: "interval_code - 140 (485..495)"
      nonirrigated_conventional: "interval_code - 100 (525..535)"
      nonirrigated_certified_organic: "interval_code - 60 (565..575)"
      nonirrigated_transitional: "interval_code - 40 (585..595)"
      status: DERIVED
      evidence: "Observed in every 2027 ADM A00030 PRF record; not a published RMA rule."

insurable_acreage:
  source: ["CP27 secs. 3-4, pp.1-2", "BP27 sec. 6"]
  status: CONFIRMED
  rules:
    - "Insure all or part of the insurable acres in the county; insured acres cannot exceed 100% of insurable acres."
    - "Perennial forage only: planted before July 1 of the previous crop year, naturally present (native grass), or self-seeding annuals kept by grazing. Annually planted acreage is not insurable (over-seeding is allowed)."
    - "Grazing: acreage too steep, too far from water, or otherwise unsuitable for grazing is not insurable for grazing."
    - "Haying: acreage too steep, wooded, cactus-covered or under water for normal haying equipment is not insurable for haying."
    - "Public land with no crop-year use authorization (or zero use acres) is not insurable (new for 2027)."
    - "Native sod in IA, MN, MT, NE, ND, SD: liability uses a 65% protection factor and subsidy is 50 percentage points lower, for 4 of the first 10 years after tillage (if tilled after 2018-12-20); exempt if 5 acres or less per grid."
  native_sod_protection_factor: {value: 0.65, source: ["CP27 sec. 4(g)(1), p.2"], status: CONFIRMED}
  native_sod_subsidy_reduction: {value: 0.50, units: "subsidy fraction points", source: ["CP27 sec. 4(g)(2), p.2"], status: CONFIRMED}
  leases: {value: "Leases (or a signed Lease Certification Form) must be submitted by the acreage reporting date.", source: ["HB26 para 21, pp.8-10", "BP27 sec. 9(d)(1)"], status: CONFIRMED}

unit_structure:
  value: "One unit = insured acres by crop, intended use, index interval, share, irrigated practice, organic practice, and county, within or assigned to one grid."
  source: ["BP27 sec. 1 definition of Unit, p.4", "HB26 para 12 (optional, enterprise and whole-farm units not applicable), p.5"]
  status: CONFIRMED
  note: "Premium and indemnity are computed separately for every (grid, interval, intended use, practice, share) unit."

grid:
  size_degrees: {value: 0.25, source: ["BP27 sec. 1 definition of Grid, p.3", "HB27 para 32A, p.12"], status: CONFIRMED}
  cell_edges:
    value: "Cells span lat/lon multiples of 0.25 (grid 15429 = 32.75-33.00 N, 98.00-97.75 W). NCEI data points are the cell centers (.125/.375/.625/.875)."
    source: ["GRID_LAYER", "RIDATA27 p.1 (lat/lon are cell centers)"]
    status: CONFIRMED
  grid_id_from_lat_lon:
    formula: "grid_id = 300 * floor((lat - 20.0) / 0.25) + floor((lon + 130.0) / 0.25) + 1"
    status: DERIVED
    evidence: "Matches all 16 study-site lookups against GRID_LAYER on 2026-10-29 and the handbook's McLouth, KS example (grids 22939/22940, HB26 paras 75-76). Use GRID_LAYER as the authority for points on a cell edge."
  grid_center_from_id:
    formula: "row = (grid_id - 1) // 300; col = (grid_id - 1) % 300; lat_c = 20.125 + 0.25 * row; lon_c = -129.875 + 0.25 * col"
    status: DERIVED
  approx_dimensions_miles:
    north_south: {value: 17.27, status: DERIVED}
    east_west_at_32.875N: {value: 14.51, status: DERIVED}
    area_sq_mi_at_32.875N: {value: 250.6, status: DERIVED}
    note: "RMA fact sheet says 'approximately 17 by 17 miles at the equator' (FACTSHEET); east-west width shrinks with cos(latitude)."
  how_producer_picks:
    value: "Producer drops a point of reference inside the field on RMA's Grid Locator map (or AIP software); the point fixes the grid ID and county. Noncontiguous fields need one point each; contiguous acreage spanning grids may be combined into one grid or split in any proportion (total cannot exceed the field's acres)."
    source: ["HB26 paras 15 and 71-76, pp.6 and 15-38", "BP27 sec. 6(f)"]
    status: CONFIRMED
  rainfall_data_source:
    crop_year_2026_and_earlier:
      value: "NOAA CPC gridded interpolated daily precipitation, 0.25 degree; history from 1948"
      source: ["HB26 paras 31, 32B, 33A, pp.11-13"]
      status: CONFIRMED
    crop_year_2027_onward:
      value: "NOAA NCEI nClimGrid-Monthly (1/24 degree) averaged to the same 0.25 degree grid; history from 1951"
      source: ["BP27 summary of changes and definitions", "HB27 paras 31-33, pp.12-15", "RIDATA27 p.1", "NCEI_GUIDE", "PM26053"]
      status: CONFIRMED
    switch_effective:
      value: "2027 crop year for PRF (contract change date 2026-08-31); Annual Forage switches for 2028"
      source: ["PM26053", "NEWS0430", "BP27 summary of changes"]
      status: CONFIRMED

