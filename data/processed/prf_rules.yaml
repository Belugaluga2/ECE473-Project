    - {code: "629", name: "May-Jun", months: [5, 6], adm_name: "MAY - JUN INDEX INTERVAL"}
    - {code: "630", name: "Jun-Jul", months: [6, 7], adm_name: "JUN - JUL INDEX INTERVAL"}
    - {code: "631", name: "Jul-Aug", months: [7, 8], adm_name: "JUL - AUG INDEX INTERVAL"}
    - {code: "632", name: "Aug-Sep", months: [8, 9], adm_name: "AUG - SEP INDEX INTERVAL"}
    - {code: "633", name: "Sep-Oct", months: [9, 10], adm_name: "SEP - OCT INDEX INTERVAL"}
    - {code: "634", name: "Oct-Nov", months: [10, 11], adm_name: "OCT - NOV INDEX INTERVAL"}
    - {code: "635", name: "Nov-Dec", months: [11, 12], adm_name: "NOV - DEC INDEX INTERVAL"}
