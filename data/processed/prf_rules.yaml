# ---------------------------------------------------------------------------------------------
# Worked examples = unit-test vectors. Inputs are real 2027 Parker County TX values (grid 15429);
# final indices 62 and 105 in ex1/ex2 are hypothetical. `expected_official` uses the 3-decimal
# payment factor; `expected_dst` reproduces RMA's Decision Support Tool. Dollars are whole dollars.
# Per-unit list fields are in the same order as `inputs.units`.
# ---------------------------------------------------------------------------------------------
worked_examples:
  - id: ex1_grazing_parker_15429
    inputs:
      crop_year: 2027
      intended_use: grazing
      state: "48"
      county: "367"
      grid: "15429"
      county_base_value: 27.60
      coverage_level: 0.90
      productivity_factor: 1.00
      insured_acres: 500
      share: 1.00
      subsidy_rate: 0.51
      admin_fee: 30
      units:
        - {interval: "628", percent_of_value: 0.50, premium_rate: 0.1581, final_index: 62.0}
        - {interval: "631", percent_of_value: 0.50, premium_rate: 0.1929, final_index: 105.0}
    expected_official:
      protection_per_acre: 24.84
      trigger: 90.0
      units:
        - {interval: "628", policy_protection: 6210, premium: 982, subsidy: 501, producer_premium: 481, pcf: 0.311, indemnity: 1931}
        - {interval: "631", policy_protection: 6210, premium: 1198, subsidy: 611, producer_premium: 587, pcf: 0.000, indemnity: 0}
      total_policy_protection: 12420
      total_premium: 2180
      total_subsidy: 1112
      total_producer_premium: 1068
      producer_cost_incl_admin_fee: 1098
      total_indemnity: 1931
      net_to_producer: 833
    expected_dst:
      indemnity: [1932, 0]
      total_indemnity: 1932
      net_to_producer: 834
      verified_against_dst: "Protection 6210/6210, premium 982/1198, subsidy 501/611 and producer premium 481/587 were returned by DST GetPricingRates on 2026-10-29."

