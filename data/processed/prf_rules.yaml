allocation_rules:
  min_intervals: {value: 2, source: ["HB26 para 32C, p.12", "CP27 sec. 2(a) ('more than one index interval'), p.1"], status: CONFIRMED}
  min_percent_per_selected_interval: {value: 0.10, source: ["CP27 sec. 2(a), p.1", "ADM27 A00810 Minimum Acre Percent = 0.10 in every PRF record"], status: CONFIRMED}
  max_percent_per_interval:
    rule: "Set in the Special Provisions / actuarial documents (ADM A00810 'Maximum Acre Percent'). In 2027 it is uniform within each state."
    jan_feb_625:
      value: 0.25
      exception: {state_fips: "06", state: "California", value: 0.50}
      note: "25% Jan-Feb cap is new for 2027"
      source: ["PM26053", "ADM27 A00810 Maximum Acre Percent, interval 625"]
      status: CONFIRMED
    other_intervals_by_state_fips:
      "0.50": ["01", "04", "06", "12", "13", "22", "28", "35", "37", "45", "48"]
      "0.60": ["05", "08", "10", "15", "17", "18", "19", "20", "21", "24", "29", "31", "32", "34", "39", "40", "42", "47", "49", "51", "54"]
      "0.70": ["09", "16", "23", "25", "26", "27", "30", "33", "36", "38", "41", "44", "46", "50", "53", "55", "56"]
      source: ["ADM27 2027 A00810 Price, Maximum Acre Percent, intervals 626-635"]
      status: CONFIRMED
    study_sites: {TX: 0.50, NM: 0.50, FL: 0.50, OK: 0.60, MO: 0.60, CO: 0.60, source: ["ADM27 A00810", "DST GetMaxAcrePercentage"], status: CONFIRMED}
  percents_are_whole_numbers: {value: true, source: ["BP27 definition of Percent of value, p.3"], status: CONFIRMED}
  percents_sum_to_one: {value: true, scope: "by grid ID, share, irrigated practice, organic practice and intended use", source: ["HB26 para 14, p.6"], status: CONFIRMED}
  no_overlapping_months:
    value: true
    rule: "The same month cannot be in more than one selected interval for the same county, grid, intended use, irrigated practice, organic practice and share (Apr-May excludes Mar-Apr and May-Jun)."
    source: ["CP27 sec. 2(b), p.1"]
    status: CONFIRMED
  max_intervals_implied: {value: 6, note: "Non-overlap allows at most 6 two-month intervals (e.g. Jan-Feb, Mar-Apr, ..., Nov-Dec).", status: DERIVED}
  differences_by_intended_use: {value: "None observed: same min/max limits for grazing and haying at all study grids.", source: ["DST GetMaxAcrePercentage", "ADM27 A00810"], status: CONFIRMED}
  insurance_period:
    value: "January 1 - December 31 of the crop year; attaches for all 12 months, but indemnity is paid only for the selected intervals."
    source: ["BP27 sec. 12, p.15", "CP27 sec. 1 (crop year)"]
    status: CONFIRMED

coverage:
  coverage_levels_allowed: {value: [0.70, 0.75, 0.80, 0.85, 0.90], source: ["CP27 sec. 5(a)(1), p.2", "ADM27 A00070", "DST coverage-level validation"], status: CONFIRMED}
  one_coverage_level_per: "county, crop, intended use, irrigated practice, organic practice"
  cat_available: {value: false, note: "CAT (65% coverage x 45% productivity) is defined in BP27 but the PRF crop provisions exclude it.", source: ["CP27 sec. 5, p.2"], status: CONFIRMED}
  productivity_factor:
    min: 0.60
    max: 1.50
    step: 0.01
    one_per: "county, crop, intended use (and practice)"
    source: ["CP27 sec. 5(a)(2), p.2", "HB26 para 13, p.5", "DST validation: 'Productivity Factor must be between 60% and 150%'"]
    status: CONFIRMED
  county_base_value:
    definition: "FCIC's determined value per acre of the crop in the county, by intended use and practice, published in the actuarial documents (ADM A00810 'County Base Value')."
    source: ["BP27 sec. 1 definition, p.2", "ADM27 A00810"]
    status: CONFIRMED
  defaults_if_no_change: {value: "Same coverage level and productivity factor as the previous year (changes are due by the sales closing date).", source: ["BP27 sec. 7(d), p.12"], status: CONFIRMED}

index:
  expected_grid_index:
    value: 100
    note: "Normalized so the long-run mean is 100; ADM A00810 Expected Index Value = 1.0000 in every 2027 PRF record."
    source: ["BP27 definition, p.2", "ADM27 A00810"]
    status: CONFIRMED
  final_grid_index_formula:
    value: "final_index[g, i, Y] = 100 * P[g, i, Y] / mean(P[g, i, y] for y in base_years(Y)), where P is the sum of the interval's two monthly precipitation totals (mm) for grid g"
    source: ["RIDATA27 p.1", "HB27 para 33D, pp.14-15"]
    status: CONFIRMED
  base_years:
    crop_year_2027_onward: {first: 1951, last: "Y - 2", example: "2027 -> 1951-2025", source: ["RIDATA27 p.1", "HB27 para 33D, p.14"], status: CONFIRMED}
    crop_year_2026_and_earlier: {first: 1948, last: "Y - 2", example: "2025 -> 1948-2023", source: ["HB26 para 33D, p.13"], status: CONFIRMED}
  rounding: {value: "Ratio rounded to 3 decimals (index to 0.1 point), e.g. 1.611 -> 161.1", source: ["RIDATA27 p.1: 'Final grid indexes are rounded to 3 decimals'"], status: CONFIRMED}
  intervals_independent: {value: true, note: "Rain in one interval has no effect on another interval's index.", source: ["HB26 para 33D, p.14"], status: CONFIRMED}
  trigger_grid_index: {formula: "trigger = expected_grid_index * coverage_level = 100 * coverage_level", source: ["BP27 definition, p.4"], status: CONFIRMED}
  final_index_corrections:
    value: "A published final index changes only if NCEI reports an error in writing, the RMA Administrator approves, and less than 1 year has passed."
    source: ["BP27 sec. 8(e), p.13"]
    status: CONFIRMED
  data_publication:
    ncei_monthly_files:
      value: "Posted on the 4th business day of each month; 'initial' = previous month (preliminary), 'final' = all months through 2 months ago."
      source: ["NCEI_GUIDE"]
      status: CONFIRMED
    ncei_final_url: "https://www.ncei.noaa.gov/pub/data/cirs/usda/monthly/final/YYYYMM.usda.csv (header latitude,longitude,precipitation; mm; 13,533 cells)"
    rma_final_index_release:
      value: "RMA PM bulletin + ADM daily file + Actuarial Information Browser, about 2 months after the interval ends."
      observed_2026_cpc_era: {"Nov-Dec 2025": "2026-03-05", "Mar-Apr 2026": "2026-07-07", "Apr-May 2026": "2026-08-03", "May-Jun 2026": "2026-09-01", "Jun-Jul 2026": "2026-10-01"}
      source: ["PM_FINALS"]
      status: CONFIRMED
    definitive_source_for_paid_indices:
      value: "Actuarial Information Browser / ADM payment factors. Bulk historical files and the DST use one historical period and cannot reproduce indices that paid in earlier years."
      source: ["RIDATA27 p.4"]
      status: CONFIRMED

premium:
  premium_rate:
    definition: "Total premium rate per $1 of policy protection, by grid, interval and coverage level (county/practice record) in the actuarial documents."
    varies_by: ["grid", "interval", "coverage level"]
    same_for_grazing_and_haying_at_study_grids: true
    source: ["BP27 sec. 11(c)-(d), p.14", "DST"]
    status: CONFIRMED
  subsidy_by_coverage_level:
    value: {0.70: 0.59, 0.75: 0.59, 0.80: 0.55, 0.85: 0.55, 0.90: 0.51}
    crop_years: [2025, 2026, 2027]
    source: ["ADM27 A00070 record category 04, plan 13", "ADM 2026 and 2025 A00070 (identical)", "DST SubsidyLevel", "USC1508 (e)(7) area yield plans: 59/55/51"]
    status: CONFIRMED
    obbba_effect: "None on these base rates (2026 A00070 re-released 2025-08-21 unchanged). For RI, OBBBA changed only the beginning-farmer definition and extra subsidy."
  beginning_farmer_extra:
    value: {years_1_2: 0.15, year_3: 0.13, year_4: 0.11, years_5_10: 0.10}
    eligibility: "Has not actively operated a farm/ranch for more than 10 crop years."
    source: ["BP27 sec. 11(g), p.15", "OBBA", "MGR25006"]
    status: CONFIRMED
  veteran_extra: {value: 0.10, note: "If both BFR and VFR, the higher (BFR) applies.", source: ["BP27 sec. 11(g)(2)-(3), p.15"], status: CONFIRMED}
  administrative_fee:
    value: 30
    units: "USD per crop per county per year"
    waived_for: ["beginning farmer/rancher", "veteran farmer/rancher", "limited resource farmer"]
    not_owed_if: "a zero acreage report is filed by the acreage reporting date"
    source: ["USC1508 (c)(10)(A)", "BP27 sec. 11(e), pp.14-15"]
    status: CONFIRMED
  premium_earned:
    value: "Earned and payable when acreage is reported; billed no earlier than the premium billing date; offset from any indemnity."
    source: ["CP27 sec. 7, p.2", "BP27 secs. 3(f) and 11(a)-(b)"]
    status: CONFIRMED
  late_interest: {value: 0.0125, units: "simple interest per calendar month on unpaid amounts", source: ["BP27 sec. 20(a), p.18"], status: CONFIRMED}
  premium_exceeds_liability: {value: "If premium + administrative fee exceed liability for any acreage, those acres are not insured.", source: ["BP27 sec. 11(f), p.15"], status: CONFIRMED}
  premium_funding_prohibited: {value: "Third-party premium funding or rebates in return for part of the indemnity: full premium owed and no indemnity.", source: ["BP27 sec. 11(i), p.15"], status: CONFIRMED}

dates_2027_crop_year:
  source: ["ADM27 A00200 Date, plan 13 (all 232,184 PRF records identical)", "CP27 sec. 9, p.3", "BP27 sec. 12, p.15"]
  status: CONFIRMED
  sales_closing: "2026-12-01"
  acreage_reporting: "2026-12-01"
  cancellation: "2026-12-01"
  premium_billing: "2027-09-01"
  termination: "2027-12-01"
  insurance_period: ["2027-01-01", "2027-12-31"]
  contract_change: "08-31 each year (2027 rules were published by 2026-08-31; the ADM field for crop year 2027 shows 2027-08-31, the next change date)"
  recurring: {sales_closing: "12-01 of prior year", acreage_reporting: "12-01 of prior year", premium_billing: "09-01", termination: "12-01", contract_change: "08-31 of prior year"}
  indemnity_payment: {value: "Within 60 days after RMA publishes the final grid index; interest accrues from day 61.", source: ["BP27 sec. 8(d), p.13", "BP27 sec. 21(a), p.19", "PM_FINALS"], status: CONFIRMED}

formulas:
  source: ["BP27 secs. 7, 8, 11, pp.12-14", "HB26 Exhibit 5, pp.50-57"]
  status: CONFIRMED
  dollar_protection_per_acre: "ppa = county_base_value * coverage_level * productivity_factor"
  unit_policy_protection: "pp_unit = ppa * insured_acres * percent_of_value * share"
  total_policy_protection: "sum(pp_unit over units), which equals ppa * acres * share when the percents sum to 1"
  trigger: "T = 100 * coverage_level"
  payment_calculation_factor: "pcf = (T - final_index) / T if final_index < T else 0"
  indemnity_unit: "indemnity = pcf * pp_unit"
  total_premium_unit: "premium = pp_unit * premium_rate[grid, interval, coverage_level]"
  subsidy_unit: "subsidy = premium * subsidy_rate[coverage_level] (+ BFR/VFR points if eligible)"
  producer_premium_unit: "producer_premium = premium - subsidy"
  producer_cost: "sum(producer_premium) + administrative_fee"
  net_to_producer: "sum(indemnity) - sum(producer_premium) - administrative_fee"
  max_indemnity_per_unit: "pp_unit (reached only if final_index = 0)"

rounding:
  official:
    payment_calculation_factor:
      value: "Round half up to 3 decimals."
      evidence: "3,000 of 3,000 sampled 2026 Jun-Jul PRF grid offers in ADM A01130 are reproduced exactly by round_half_up((T - I) / T, 3) with I to 0.1 point; round-half-even fits only 2,648."
      source: ["ADM26D", "ADM_LAYOUT A01130 Payment Factor"]
      status: CONFIRMED
    final_index: {value: "0.1 index point (ratio to 3 decimals)", source: ["RIDATA27 p.1"], status: CONFIRMED}
    dollar_amounts: {value: "Whole dollars for unit protection, premium, subsidy and indemnity.", source: ["HB26 Exhibit 5, p.50: 'Some of the calculations in the example are rounded to the nearest whole dollar.'"], status: CONFIRMED}
    indemnity_uses_published_pcf:
      value: true
      note: "Indemnity = published 3-decimal factor x unit protection, as in HB26 Exhibit 5 (0.111, 0.333, 0.056 ...). We have not seen an actual AIP indemnity statement."
      status: INFERRED
  dst_estimator:
    description: "Rules that reproduce RMA's Decision Support Tool exactly (4 test cases, 8 units)."
    ppa: "round to cents"
    pp_unit: "round to whole dollars (nearest)"
    premium: "round(pp_unit * rate) to whole dollars"
    subsidy: "round(premium * subsidy_rate) to whole dollars, per unit, half up"
    indemnity: "round(unrounded_pcf * pp_unit) to whole dollars (the DST does NOT round pcf to 3 decimals)"
    source: ["DST"]
    status: CONFIRMED
  handbook_exhibit5_quirks: "Handbook subsidy is taken on the total premium (1,114 x 0.51 = 568), not per unit (sum would be 566). One indemnity (588) uses unrounded unit protection (2,116.80)."
  recommended_for_our_calculator: "Use the 'official' 3-decimal pcf for indemnities and the DST rules for protection, premium and subsidy. Expose a flag that switches pcf to unrounded so results can be checked against the DST."

limitations:
  - "Area/index plan: no loss adjustment and no measurement of the producer's actual forage loss (HB26 para 20; BP27 sec. 13)."
  - "Single peril: below-normal interpolated rainfall in the chosen two-month intervals. Not drought, heat, wind, fire, flood or hail insurance (HB26 paras 31 and 34A)."
  - "Basis risk: grid index vs rain on the ranch, and rain vs forage growth (timing, temperature, soil-moisture carry-over)."
  - "Interval allocation is itself the hedge decision: protection put on a low-risk interval is unavailable for a high-risk one; caps (25% Jan-Feb, 50-70% otherwise) and the non-overlap rule limit concentration."
  - "Data-source basis: from 2027 the indices come from NCEI, not CPC; per-grid values can differ a lot from CPC (see doc)."

