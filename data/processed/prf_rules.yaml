# PRF (Pasture, Rangeland, Forage) Rainfall Index insurance: machine-readable rule set.
#
# Owner: R3 / Maya (Week 1). Companion doc: docs/research/01_usda_prf_mechanics.md (plain-language
# explanations, verification status of every number, and the worked examples step by step).
# Compiled 2026-10-29. Rules are for the 2027 crop year (the year now on sale; sales closing
# 2026-12-01) unless a field says otherwise. Differences for the 2026 crop year are noted.
#
# Conventions used in this file:
#   * Fractions, not percents: coverage 0.90, productivity 1.00, subsidy 0.51, percent of value 0.50.
#   * Index values are in "percent of normal" points (100 = average rain; trigger 90 at 90% coverage).
#   * Dollar amounts in US dollars. Dates ISO (YYYY-MM-DD); recurring dates as MM-DD.
#   * Codes (interval, state, county, grid, practice) are strings so leading zeros survive.
#   * `source:` lists keys into `sources` below, with a pinpoint (page, section, table, record type).
#     `status:` CONFIRMED = read in the primary document or primary RMA data/tool;
#     DERIVED = computed by us from confirmed inputs; INFERRED = our reading, not stated outright.

