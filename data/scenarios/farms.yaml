# Representative farm exposures for the PRF study sites (R8, Week 1, Jack).
# Full explanation, sources, and verification status: docs/research/04_representative_farms.md
# Built 2026-10-29. Rebuild inputs with: python scripts/r8_pull_county_data.py
# Validate against PRF rules with:      python scripts/r8_pull_county_data.py --steps validate
#
# Conventions
# - Crop year 2026 actuarial terms (RMA Actuarial Data Master 2026, Price table A00810).
#   County base values are identical in the 2027 Decision Support Tool (checked 2026-10-29).
# - Policy protection ($) = insured_acres x county_base_value x productivity_factor x coverage_level.
#   Each interval's share of protection = protection x interval_allocation[interval].
# - PRF allocation rules checked (26-RI-PRF Crop Provisions sec. 2 and 5; ADM 2026 Price table):
#   >= 2 intervals; each interval >= 10%; each interval <= county max (50% in TX, NM, FL;
#   60% in OK, MO, CO); no calendar month in two selected intervals; shares sum to 100%;
#   coverage 70-90% (5-point steps); productivity factor 60-150%. All allocations also keep
#   Jan-Feb at or below 25% (new 2027 cap seen in the Decision Support Tool) by not using it.
# - expected_production: haying = tons/acre (NASS state 2016-2025 mean, "other hay");
#   grazing = normal-year air-dry forage lb/acre (NRCS SSURGO area-weighted, or a hay-yield
#   proxy for improved pasture) and aum_per_acre = lb x 0.25 harvest efficiency / 912.5 lb per AUM.
# - expected_value_usd_per_acre: haying = expected yield x NASS 2025 marketing-year state price
#   (other hay); grazing = NASS pasture cash rent for the county (latest year published).
# - productivity_factor follows the county's observed choice: liability-weighted average
#   implied by RMA Summary of Business 2026 (1.28-1.50), rounded to 0.05.
# - coverage_level = the most common coverage level (by insured acres) in the county, 2021-2025.
# - irrigation_practice: PRF grazing has no irrigation practice (ADM code 997 = "not specified").
# - lat/lon = county internal point from agri_hedge.locations (farm point). PRF grid for that
#   point is in data/processed/study_grids.csv (role = farm).

farms:
  - farm_id: DFW_hay
    site: DFW
    county: Parker County, TX
    fips: "48367"
    lat: 32.777096
    lon: -97.805905
    intended_use: haying
    irrigation_practice: non-irrigated
    organic: false
    insured_acres: 150
    productivity_factor: 1.50
    coverage_level: 0.90
    interval_allocation:
      "Apr-May": 0.40
      "Jun-Jul": 0.35
      "Aug-Sep": 0.25
    county_base_value_usd_per_acre: 181.0
    expected_production: {value: 1.92, units: "tons/acre"}
    expected_value_usd_per_acre: 249.6
    rain_sensitivity_ref: "scen_DFW_hay"
    rationale: >-
      Dryland improved bermudagrass hay producer in the West Cross Timbers. 150 acres is a
      commercial hay enterprise (county average is 33 harvested acres per hay operation, Census
      2022; Parker PRF haying totals 1,477 insured acres in 2026). Bermudagrass is a warm-season
      grass, so we assume rain from April to September sets tonnage; farm-grid rainfall peaks in
      May-June (1991-2020 CPC). Intervals Apr-May, Jun-Jul, Aug-Sep cover the
      whole cutting season without sharing a month. 90% coverage is the county's modal level (70%
      of 2021-2025 insured acres); PF 1.50 matches Parker haying buyers (implied 1.50 in 2026).
      Yield = Texas other-hay mean 2016-2025 (1.50 in 2022 drought to 2.45); value at the Texas
      2025 other-hay price of $130/ton.
    sources:
      - "RMA ADM 2026 Price table A00810 (County Base Value), 2026_ADM_YTD.zip: https://pubfs-rma.fpac.usda.gov/pub/References/actuarial_data_master/2026/"
      - "RMA Summary of Business sobcov/sobtpu 2015-2026: https://pubfs-rma.fpac.usda.gov/pub/Web_Data_Files/Summary_of_Business/state_county_crop/"
      - "PRF Crop Provisions 26-RI-PRF: https://www.rma.usda.gov/sites/default/files/2025-08/Rainfall-Index-Pasture-Rangeland-Forage-Crop-Provisions-26-RI-PRF.pdf"
      - "NASS Quick Stats, HAY (EXCL ALFALFA) yield and price received, Texas, 2016-2025: https://quickstats.nass.usda.gov/"
      - "NASS 2022 Census of Agriculture county data (Quick Stats) and profile: https://www.nass.usda.gov/Publications/AgCensus/2022/Online_Resources/County_Profiles/Texas/cp48367.pdf"

