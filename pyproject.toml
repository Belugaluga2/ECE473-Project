[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-hedge"
version = "0.1.0"
description = "ECE473: replicating USDA rainfall-index (PRF) insurance payouts with Kalshi weather contracts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pyyaml>=6",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
